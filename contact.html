<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=1793367759">
</head>
<body data-page="contact" data-scene="ambient">
<main id="main">
<section class="page-hero page-hero--short">
  
  <div class="page-hero__inner">
    <nav class="crumbs reveal-up" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home">Start</a><i></i><span data-i18n="nav.contact"></span></nav>
    <p class="tag reveal-up" data-i18n="contact.hero.tag"></p>
    <h1 class="h1 split-words" data-i18n="contact.hero.title"></h1>
    <p class="lead reveal-up" data-i18n="contact.hero.lead"></p>
  </div>
</section>
<section class="section" style="padding-top:30px">
  <div class="wrap contact__grid">
    <div>
      <p class="tag" data-i18n="contact.direct"></p>
      <a class="contact__mail js-mail" href="#"></a>
      <div class="depts">
        <div class="dept"><small data-i18n="contact.phone"></small><a class="js-tel" href="#"></a><a class="copy" href="https://wa.me/31613922391" target="_blank" rel="noopener">WhatsApp</a></div>
        <div class="dept"><small data-i18n="contact.email"></small><a class="js-mail" href="#"></a><button class="copy js-copy" type="button"><span data-i18n="contact.copy"></span></button></div>
      </div>
      <p class="tag tag--small" data-i18n="contact.follow"></p>
      <div class="js-socials"></div>
    </div>
    <form class="form glass" id="contactForm" novalidate>
      <label for="cfName"><span data-i18n="contact.name"></span><input id="cfName" name="name" required autocomplete="name"></label>
      <label for="cfEmail"><span data-i18n="contact.email"></span><input id="cfEmail" name="email" type="email" required autocomplete="email"></label>
      <label for="cfCompany"><span data-i18n="contact.company"></span><input id="cfCompany" name="company" autocomplete="organization"></label>
      <fieldset>
        <legend data-i18n="contact.type"></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="type" value="Booking" checked><span data-i18n="contact.t1"></span></label>
          <label class="chip"><input type="radio" name="type" value="Partnership"><span data-i18n="contact.t2"></span></label>
          <label class="chip"><input type="radio" name="type" value="Tickets"><span data-i18n="contact.t3"></span></label>
          <label class="chip"><input type="radio" name="type" value="Press"><span data-i18n="contact.t4"></span></label>
        </div>
      </fieldset>
      <label for="cfMsg"><span data-i18n="contact.msg"></span><textarea id="cfMsg" name="message" rows="5" required></textarea></label>
      <label class="consent" for="cfConsent"><input id="cfConsent" type="checkbox" name="consent"><span class="lbl" data-i18n="contact.consent"></span></label>
      <button class="btn btn--grad btn--block" type="submit"><span data-i18n="contact.send"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form__note" id="formNote" aria-live="polite"></p>
    </form>
  </div>
</section>
<section class="section" style="padding-top:0">
  <div class="wrap faq-grid">
    <div><p class="tag" data-i18n="faq.tag"></p><h2 class="h2" data-i18n="faq.title"></h2></div>
    <div class="faq"><details><summary data-i18n="faq.q1"></summary><div class="faq__a"><p data-i18n="faq.a1"></p></div></details><details><summary data-i18n="faq.q2"></summary><div class="faq__a"><p data-i18n="faq.a2"></p></div></details><details><summary data-i18n="faq.q3"></summary><div class="faq__a"><p data-i18n="faq.a3"></p></div></details><details><summary data-i18n="faq.q4"></summary><div class="faq__a"><p data-i18n="faq.a4"></p></div></details><details><summary data-i18n="faq.q5"></summary><div class="faq__a"><p data-i18n="faq.a5"></p></div></details></div>
  </div>
</section>

</main>
<script src="js/config.js?v=1793367759"></script>
<script src="js/i18n.js?v=1793367759"></script>

<script src="vendor/three.min.js?v=1793367759"></script>
<script src="vendor/gsap.min.js?v=1793367759"></script>
<script src="vendor/ScrollTrigger.min.js?v=1793367759"></script>
<script src="vendor/lenis.min.js?v=1793367759"></script>


<script src="js/scene.js?v=1793367759"></script>


<script src="js/app.js?v=1793367759"></script>
<script src="js/carousel.js?v=1793367759"></script>

</body>
</html>
