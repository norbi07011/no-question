<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="media" data-scene="ambient">
<main id="main">
<section class="page-hero">
  <div class="page-hero__bg" aria-hidden="true"><video src="assets/video/brand-logo.mp4" muted loop playsinline preload="metadata" class="autoplay"></video></div>
  <div class="page-hero__inner">
    <nav class="crumbs reveal-up" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home">Start</a><i></i><span data-i18n="nav.media"></span></nav>
    <p class="tag reveal-up" data-i18n="media.hero.tag"></p>
    <h1 class="h1 split-words" data-i18n="media.hero.title"></h1>
    <p class="lead reveal-up" data-i18n="media.hero.lead"></p>
  </div>
</section>
<section class="section reels3d media-sec" style="padding-top:40px">
  <div class="wrap reels__head">
    <div><p class="tag" data-i18n="media.vid.tag"></p><h2 class="h2 split-words" data-i18n="media.vid.title"></h2></div>
    <p class="body reels__sub" data-i18n="media.vid.sub"></p>
  </div>
  <div class="chips-row"><div class="tabs" role="tablist" data-filter-for="rcVideos">
    <button class="is-active" data-filter="all" role="tab" aria-selected="true" data-i18n="mf.all"></button>
    <button data-filter="live" role="tab" aria-selected="false" data-i18n="mf.live"></button>
    <button data-filter="backstage" role="tab" aria-selected="false" data-i18n="mf.backstage"></button>
    <button data-filter="promo" role="tab" aria-selected="false" data-i18n="mf.promo"></button>
  </div></div>
  
<div class="rc" data-carousel="reels" id="rcVideos" tabindex="0" aria-roledescription="carousel">
  <div class="rc__bg" aria-hidden="true"></div>
  <div class="rc__stage"><div class="rc__ring"></div><div class="rc__pedestal" aria-hidden="true"><i></i></div></div>
  <div class="rc__info">
    <button class="rc__nav rc__prev" aria-label="Prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rc__meta">
      <p class="rc__line"><span class="rc__num"></span><span class="rc__cat"></span></p>
      <h3 class="rc__title"></h3>
      <button class="btn btn--grad rc__play" data-lb="video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span data-i18n="rc.play"></span></button>
    </div>
    <button class="rc__nav rc__next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="rc__dots"></div>
  <p class="rc__hint" data-i18n="rc.drag"></p>
</div>
</section>

<section class="section reels3d media-sec" id="posters">
  <div class="wrap reels__head">
    <div><p class="tag" data-i18n="media.post.tag"></p><h2 class="h2 split-words" data-i18n="media.post.title"></h2></div>
    <p class="body reels__sub" data-i18n="media.post.sub"></p>
  </div>
  
<div class="rc rc--posters" data-carousel="posters" id="rcPosters" tabindex="0" aria-roledescription="carousel">
  <div class="rc__bg" aria-hidden="true"></div>
  <div class="rc__stage"><div class="rc__ring"></div><div class="rc__pedestal" aria-hidden="true"><i></i></div></div>
  <div class="rc__info">
    <button class="rc__nav rc__prev" aria-label="Prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rc__meta">
      <p class="rc__line"><span class="rc__num"></span><span class="rc__cat"></span></p>
      <h3 class="rc__title"></h3>
      <button class="btn btn--grad rc__play" data-lb="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><span data-i18n="rc.zoom"></span></button>
    </div>
    <button class="rc__nav rc__next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="rc__dots"></div>
  <p class="rc__hint" data-i18n="rc.drag"></p>
</div>
</section>

</main>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>


<script src="js/scene.js"></script>


<script src="js/app.js"></script>
<script src="js/carousel.js"></script>

</body>
</html>
