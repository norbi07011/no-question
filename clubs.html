<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css?v=1793373301">
<link rel="stylesheet" href="css/style.css?v=1793373301">
</head>
<body data-page="clubs" data-scene="ambient">
<main id="main">
<section class="page-hero">
  <div class="page-hero__bg" aria-hidden="true"><video src="assets/video/live-teal.mp4" muted loop playsinline preload="metadata" class="autoplay"></video></div>
  <div class="page-hero__inner">
    <nav class="crumbs reveal-up" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home">Start</a><i></i><span data-i18n="nav.clubs"></span></nav>
    <p class="tag reveal-up" data-i18n="clubs.hero.tag"></p>
    <h1 class="h1 split-words" data-i18n="clubs.hero.title"></h1>
    <p class="lead reveal-up" data-i18n="clubs.hero.lead"></p>
  </div>
</section>
<section class="section" style="padding-top:20px">
  <div class="wrap clubs-page">
    <div class="clubs__list" id="clubsList" data-variant="full"></div>
    <div class="clubs__map glass" id="mapWrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="clubs__map-hud" aria-hidden="true"><span>NL</span><span id="mapCoords"></span></div>
</div>
  </div>
</section>
<section class="band">
  <div class="wrap"><div class="band__box">
    <div><p class="tag" data-i18n="home.news.tag"></p><h2 class="band__title" data-i18n="home.news.title"></h2><p class="body" data-i18n="home.news.sub"></p></div>
    <form class="news js-news" novalidate>
      <label class="sr" for="newsEmail" data-i18n="contact.email"></label>
      <input id="newsEmail" type="email" name="email" autocomplete="email" data-i18n-ph="home.news.ph" required>
      <button class="btn btn--grad" type="submit"><span data-i18n="home.news.btn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form__note" aria-live="polite"></p>
    </form>
  </div></div>
</section>
</main>
<script src="js/config.js?v=1793373301"></script>
<script src="js/i18n.js?v=1793373301"></script>
<script src="js/layout.js?v=1793373301"></script>
<script src="vendor/three.min.js?v=1793373301"></script>
<script src="vendor/gsap.min.js?v=1793373301"></script>
<script src="vendor/ScrollTrigger.min.js?v=1793373301"></script>
<script src="vendor/lenis.min.js?v=1793373301"></script>
<script src="vendor/leaflet.js?v=1793373301"></script>

<script src="js/scene.js?v=1793373301"></script>


<script src="js/app.js?v=1793373301"></script>
<script src="js/carousel.js?v=1793373301"></script>

</body>
</html>
