<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css?v=1793367759">
<link rel="stylesheet" href="css/style.css?v=1793367759">
</head>
<body data-page="home" data-scene="ambient">
<main id="main">

<section class="hero hero--logo" id="hero">
  <div class="hero__video" aria-hidden="true"><video id="heroVideo" muted loop playsinline autoplay preload="auto" poster="assets/img/hero-bg.jpg" data-d="assets/video/hero-bg.mp4" data-m="assets/video/hero-bg-m.mp4" data-pm="assets/img/hero-bg-m.jpg"></video><span class="hero__veil"></span></div>
  <canvas class="hero__logo" id="heroLogo" aria-hidden="true"></canvas>
  <div class="hero__inner">
    <p class="kicker reveal-up" data-i18n="hero.kicker"></p>
    <h1 class="hero__title">
      <span class="line"><span class="split" data-i18n="hero.line1">Geen</span></span>
      <span class="line line--grad"><span class="split" data-i18n="hero.line2">vragen.</span></span>
      <span class="line line--outline"><span class="split" data-i18n="hero.line3">Alleen live.</span></span>
    </h1>
    <p class="hero__sub reveal-up" data-i18n="hero.sub"></p>
    <div class="hero__ctas reveal-up" data-next-event>
      <a href="events.html" data-ne-link class="btn btn--grad"><span data-ne-title>Sarius × Bonson × Epis</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a href="media.html" class="btn btn--ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span data-i18n="hero.cta2"></span></a>
    </div>
  </div>
  <div class="hero__scroll"><span class="hero__mouse"></span><span data-i18n="hero.scroll"></span></div>
</section>

<section class="gear" id="nqGear" aria-label="Gear">
  <div class="gear__sticky">
    <canvas id="gearCanvas" aria-hidden="true"></canvas>
    <div class="gear__labels" aria-hidden="true"></div>
    <div class="gear__copy">
      <div class="gear__ch">
        <p class="tag"><span class="gear__n">01</span><span data-i18n="gear.c1"></span></p>
        <h2 class="gear__t" data-i18n="gear.t1"></h2>
        <p class="gear__d" data-i18n="gear.d1"></p>
      </div>
      <div class="gear__ch">
        <p class="tag"><span class="gear__n">02</span><span data-i18n="gear.c2"></span></p>
        <h2 class="gear__t" data-i18n="gear.t2"></h2>
        <p class="gear__d" data-i18n="gear.d2"></p>
      </div>
      <div class="gear__ch" data-next-event>
        <p class="tag"><span class="gear__n">03</span><span data-i18n="gear.c3"></span></p>
        <h2 class="gear__t" data-i18n="gear.t3"></h2>
        <p class="gear__d" data-i18n="gear.d3"></p>
        <div class="hero__ctas">
          <a href="#" data-ne-ticket class="btn btn--grad"><span data-i18n="event.buy"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="events.html" data-ne-link class="btn btn--ghost"><span data-ne-title></span></a>
        </div>
      </div>
    </div>
    <nav class="gear__hud" aria-label="Gear">
      <button class="is-on"><span>01</span><b data-i18n="gear.c1"></b></button>
      <button><span>02</span><b data-i18n="gear.c2"></b></button>
      <button><span>03</span><b data-i18n="gear.c3"></b></button>
    </nav>
    <div class="gear__foot"><span class="gear__count"><b class="gear__num">01</b> / 03</span><span class="gear__bar"><i></i></span><span data-i18n="gear.scroll"></span></div>
  </div>
</section>

<section class="marquee" aria-hidden="true">
  <div class="marquee__row" data-dir="1"><div class="marquee__track" id="wordsA"></div></div>
  <div class="marquee__row marquee__row--alt" data-dir="-1"><div class="marquee__track" id="wordsB"></div></div>
</section>

<section class="section spot" data-next-event>
  <div class="wrap">
    <div class="spot__card">
      <a href="events.html" data-ne-link class="poster3d tilt tilt--strong"><img data-ne-poster src="assets/img/poster-sarius.jpg" alt="Sarius, Epis, Bonson — Effenaar Eindhoven"></a>
      <div>
        <p class="tag" data-i18n="home.next.tag"></p>
        <span class="live-dot"><i></i><span data-i18n="event.status"></span></span>
        <h2 class="spot__title" data-ne-title></h2>
        <ul class="spot__meta">
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-ne-date></span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-ne-time></span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-ne-venue></span></li>
        </ul>
        <div data-ne-cd></div>
        <div class="event__ctas">
          <a href="#" data-ne-ticket class="btn btn--grad"><span data-i18n="event.buy"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="events.html" data-ne-link class="btn btn--ghost"><span data-i18n="cta.details"></span></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="sec-head">
      <div><p class="tag" data-i18n="home.what.tag"></p><h2 class="h2 split-words" data-i18n="home.what.title"></h2></div>
      <p class="body reveal-up" data-i18n="home.what.sub"></p>
    </div>
    <div class="features" data-stagger>
  <a href="about.html" class="feature tilt"><span class="feature__num">01</span>
    <svg class="feature__icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v22a6 6 0 1 1-4-5.6V6h4Z"/><path d="M28 10c5 1 9 5 10 10"/><path d="M28 16c2 .6 4 2.4 4.6 4.6"/></svg>
    <h3 data-i18n="feat.1t"></h3><p data-i18n="feat.1d"></p><span class="feature__more" data-i18n="cta.more"></span></a>
  <a href="about.html" class="feature tilt"><span class="feature__num">02</span>
    <svg class="feature__icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="5"/><path d="M24 8v4M24 36v4M8 24h4M36 24h4"/></svg>
    <h3 data-i18n="feat.2t"></h3><p data-i18n="feat.2d"></p><span class="feature__more" data-i18n="cta.more"></span></a>
  <a href="about.html" class="feature tilt"><span class="feature__num">03</span>
    <svg class="feature__icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 40h36M10 40V18l14-10 14 10v22"/><path d="M18 40V28h12v12"/><path d="M4 18h40"/></svg>
    <h3 data-i18n="feat.3t"></h3><p data-i18n="feat.3d"></p><span class="feature__more" data-i18n="cta.more"></span></a>
  <a href="media.html" class="feature tilt"><span class="feature__num">04</span>
    <svg class="feature__icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="12" width="26" height="24" rx="4"/><path d="M32 20l10-6v20l-10-6"/></svg>
    <h3 data-i18n="feat.4t"></h3><p data-i18n="feat.4d"></p><span class="feature__more" data-i18n="nav.media"></span></a>
</div>
  </div>
</section>

<section class="section reels3d" id="reels">
  <div class="wrap reels__head">
    <div><p class="tag" data-i18n="home.reels.tag"></p><h2 class="h2 split-words" data-i18n="home.reels.title"></h2></div>
    <div><p class="body reels__sub" data-i18n="home.reels.sub"></p><a class="link-arrow" href="media.html"><span data-i18n="cta.all"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
  </div>
  
<div class="rc" data-carousel="reels" data-set="home" tabindex="0" aria-roledescription="carousel">
  <div class="rc__bg" aria-hidden="true"></div>
  <div class="rc__stage"><div class="rc__ring"></div><div class="rc__pedestal" aria-hidden="true"><i></i></div></div>
  <div class="rc__info">
    <button class="rc__nav rc__prev" aria-label="Prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rc__meta">
      <p class="rc__line"><span class="rc__num"></span><span class="rc__cat"></span></p>
      <h3 class="rc__title"></h3>
      <button class="btn btn--grad rc__play" data-lb="video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span data-i18n="rc.play"></span></button>
    </div>
    <button class="rc__nav rc__next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="rc__dots"></div>
  <p class="rc__hint" data-i18n="rc.drag"></p>
</div>
</section>

<section class="section clubs">
  <div class="wrap">
    <div class="sec-head">
      <div><p class="tag" data-i18n="home.clubs.tag"></p><h2 class="h2 split-words" data-i18n="home.clubs.title"></h2></div>
      <div><p class="body reveal-up" data-i18n="home.clubs.sub"></p><a class="link-arrow" href="clubs.html"><span data-i18n="cta.clubs"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    </div>
    <div class="clubs__grid">
      <div class="clubs__list" id="clubsList"></div>
      <div class="clubs__map glass" id="mapWrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="clubs__map-hud" aria-hidden="true"><span>NL</span><span id="mapCoords"></span></div>
</div>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap"><div class="band__box">
    <div><p class="tag" data-i18n="home.news.tag"></p><h2 class="band__title" data-i18n="home.news.title"></h2><p class="body" data-i18n="home.news.sub"></p></div>
    <form class="news js-news" novalidate>
      <label class="sr" for="newsEmail" data-i18n="contact.email"></label>
      <input id="newsEmail" type="email" name="email" autocomplete="email" data-i18n-ph="home.news.ph" required>
      <button class="btn btn--grad" type="submit"><span data-i18n="home.news.btn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form__note" aria-live="polite"></p>
    </form>
  </div></div>
</section>
<section class="section partners-sec">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="partners.tag"></p><h2 class="h2 split-words" data-i18n="partners.title"></h2></div><a class="link-arrow" href="partners.html"><span data-i18n="cta.partners"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    <div class="plogos" data-stagger><a class="plogo" href="partners.html#p-jd"><img src="assets/img/partners/jd-video.png" alt="J&amp;D Video Productions" loading="lazy"></a><a class="plogo" href="partners.html#p-dajlatan"><img src="assets/img/partners/dajlatan.png" alt="Dajlatan Watch" loading="lazy"></a><a class="plogo" href="partners.html#p-ptb"><img src="assets/img/partners/passtheblunt.png" alt="Pass the Blunt" loading="lazy"></a><a class="plogo" href="partners.html#p-zenit"><span class="pmark">ZENIT<small>DESIGN</small></span></a><a class="plogo" href="partners.html#p-rapoland"><img src="assets/img/partners/rapoland.png" alt="Rapoland.nl" loading="lazy"></a><a class="plogo" href="partners.html#p-anturaz"><img src="assets/img/partners/anturaz.png" alt="Agencja Anturaż" loading="lazy"></a><a class="plogo" href="partners.html#p-effenaar"><img src="assets/img/partners/effenaar.png" alt="Effenaar" loading="lazy"></a><a class="plogo" href="partners.html#p-baroeg"><img src="assets/img/partners/baroeg.png" alt="Baroeg" loading="lazy"></a><a class="plogo" href="partners.html#p-qfactory"><span class="pmark">Q&#8209;FACTORY<small>AMSTERDAM</small></span></a></div>
  </div>
</section>

</main>

</body>
</html>
