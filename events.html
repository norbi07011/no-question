<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=1793371037">
</head>
<body data-page="events" data-scene="ambient">
<main id="main">
<section class="page-hero">
  <div class="page-hero__bg" aria-hidden="true"><video src="assets/video/aftermovie-1.mp4" muted loop playsinline preload="metadata" class="autoplay"></video></div>
  <div class="page-hero__inner">
    <nav class="crumbs reveal-up" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home">Start</a><i></i><span data-i18n="nav.events"></span></nav>
    <p class="tag reveal-up" data-i18n="events.hero.tag"></p>
    <h1 class="h1 split-words" data-i18n="events.hero.title"></h1>
    <p class="lead reveal-up" data-i18n="events.hero.lead"></p>
  </div>
</section>
<section class="section cal" style="padding-top:20px">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="events.cal.tag"></p><h2 class="h2 split-words" data-i18n="events.cal.title"></h2></div><p class="body" data-i18n="events.cal.sub"></p></div>
    <div class="tline" id="tline"></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" data-filter-group="events">
        <button class="is-active" data-filter="all" role="tab" aria-selected="true" data-i18n="filter.all"></button>
        <button data-filter="concert" role="tab" aria-selected="false" data-i18n="filter.concert"></button>
        <button data-filter="club" role="tab" aria-selected="false" data-i18n="filter.club"></button>
        <button data-filter="festival" role="tab" aria-selected="false" data-i18n="filter.festival"></button>
      </div>
      <p class="tag" style="margin:0" data-i18n="events.upcoming"></p>
    </div>
    <div class="evlist" id="eventsList"></div>
  </div>
</section>

<section class="section history">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="events.hist.tag"></p><h2 class="h2 split-words" data-i18n="events.hist.title"></h2></div><p class="body" data-i18n="events.hist.sub"></p></div>
    <div class="evlist evlist--past" id="pastList"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="events.archive.tag"></p><h2 class="h2 split-words" data-i18n="events.archive.title"></h2></div><p class="body" data-i18n="events.archive.sub"></p></div>
    <div class="archive" id="archiveGrid" data-lb-group></div>
  </div>
</section>

<section class="section">
  <div class="wrap faq-grid">
    <div><p class="tag" data-i18n="faq.tag"></p><h2 class="h2 split-words" data-i18n="faq.title"></h2></div>
    <div class="faq"><details><summary data-i18n="faq.q1"></summary><div class="faq__a"><p data-i18n="faq.a1"></p></div></details><details><summary data-i18n="faq.q2"></summary><div class="faq__a"><p data-i18n="faq.a2"></p></div></details><details><summary data-i18n="faq.q3"></summary><div class="faq__a"><p data-i18n="faq.a3"></p></div></details><details><summary data-i18n="faq.q4"></summary><div class="faq__a"><p data-i18n="faq.a4"></p></div></details><details><summary data-i18n="faq.q5"></summary><div class="faq__a"><p data-i18n="faq.a5"></p></div></details></div>
  </div>
</section>

<section class="band">
  <div class="wrap"><div class="band__box">
    <div><p class="tag" data-i18n="home.news.tag"></p><h2 class="band__title" data-i18n="home.news.title"></h2><p class="body" data-i18n="home.news.sub"></p></div>
    <form class="news js-news" novalidate>
      <label class="sr" for="newsEmail" data-i18n="contact.email"></label>
      <input id="newsEmail" type="email" name="email" autocomplete="email" data-i18n-ph="home.news.ph" required>
      <button class="btn btn--grad" type="submit"><span data-i18n="home.news.btn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="form__note" aria-live="polite"></p>
    </form>
  </div></div>
</section>

</main>
<script src="js/config.js?v=1793371037"></script>
<script src="js/i18n.js?v=1793371037"></script>
<script src="js/layout.js?v=1793371037"></script>
<script src="vendor/three.min.js?v=1793371037"></script>
<script src="vendor/gsap.min.js?v=1793371037"></script>
<script src="vendor/ScrollTrigger.min.js?v=1793371037"></script>
<script src="vendor/lenis.min.js?v=1793371037"></script>


<script src="js/scene.js?v=1793371037"></script>


<script src="js/app.js?v=1793371037"></script>
<script src="js/carousel.js?v=1793371037"></script>

</body>
</html>
