<head>

<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">

<body data-page="partners" data-scene="ambient">
<main id="main">

<section class="pshow" id="pShow" aria-label="Partners">
  <div class="pshow__sticky">
    <div class="pshow__bg" aria-hidden="true"></div>
    <div class="pshow__glow" aria-hidden="true"></div>
    <div class="pshow__grid"></div>
    <div class="pshow__copy">
      <div class="pshow__intro">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home">Start</a><i></i><span data-i18n="nav.partners"></span></nav>
        <p class="tag" data-i18n="pt.hero.tag"></p>
        <h1 class="h1" data-i18n="pt.hero.title"></h1>
        <p class="lead" data-i18n="pt.hero.lead"></p>
      </div>
      <div class="pshow__now" aria-live="polite">
        <span class="pshow__idx"></span>
        <strong class="pshow__name"></strong>
        <span class="pshow__role"></span>
        <div class="pshow__links"></div>
      </div>
      <div class="pshow__final"><p class="tag" data-i18n="pt.final.tag"></p><h2 class="h2" data-i18n="pt.final.title"></h2></div>
    </div>
    <div class="pshow__foot"><span data-i18n="pt.scroll"></span><span class="pshow__bar"><i></i></span></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="pt.partners.tag"></p><h2 class="h2 split-words" data-i18n="pt.partners.title"></h2></div><p class="body" data-i18n="pt.partners.sub"></p></div>
    <div class="pcards" id="pPartners"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><div><p class="tag" data-i18n="pt.collab.tag"></p><h2 class="h2 split-words" data-i18n="pt.collab.title"></h2></div><div><p class="body" data-i18n="pt.collab.sub"></p><a class="link-arrow" href="clubs.html"><span data-i18n="cta.clubs"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div>
    <div class="pcards" id="pCollabs"></div>
  </div>
</section>

<section class="pbelt" aria-hidden="true" id="pBelt"></section>

<section class="band">
  <div class="wrap"><div class="band__box">
    <div><p class="tag" data-i18n="pt.cta.tag"></p><h2 class="band__title" data-i18n="pt.cta.title"></h2><p class="body" data-i18n="pt.cta.sub"></p></div>
    <div class="event__ctas"><a class="btn btn--grad" href="contact.html"><span data-i18n="pt.cta.btn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn btn--ghost js-mail" href="#"></a></div>
  </div></div>
</section>

<section class="section nqc-intro">
  <div class="wrap"><div class="sec-head"><div><p class="tag" data-i18n="pt.club.tag"></p><h2 class="h2 split-words" data-i18n="pt.club.title"></h2></div><p class="body" data-i18n="pt.club.sub"></p></div></div>
</section>

    <canvas id="nqcCanvas" aria-hidden="true"></canvas>
    <div class="nqc__shade" aria-hidden="true"></div>
    <div class="nqc__ch" data-from="0" data-to="0.12">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">01</span><span data-i18n="club.c1"></span></p>
        <h2 class="nqc__t" data-i18n="club.t1"></h2>
        <p class="nqc__d" data-i18n="club.d1"></p>
      </div>
    </div>
    <div class="nqc__ch" data-from="0.16" data-to="0.30">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">02</span><span data-i18n="club.c2"></span></p>
        <h2 class="nqc__t" data-i18n="club.t2"></h2>
        <p class="nqc__d" data-i18n="club.d2"></p>
      </div>
    </div>
    <div class="nqc__ch" data-from="0.34" data-to="0.46">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">03</span><span data-i18n="club.c3"></span></p>
        <h2 class="nqc__t" data-i18n="club.t3"></h2>
        <p class="nqc__d" data-i18n="club.d3"></p>
      </div>
    </div>
    <div class="nqc__ch" data-from="0.52" data-to="0.68">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">04</span><span data-i18n="club.c4"></span></p>
        <h2 class="nqc__t" data-i18n="club.t4"></h2>
        <p class="nqc__d" data-i18n="club.d4"></p>
      </div>
    </div>
    <div class="nqc__ch" data-from="0.73" data-to="0.85">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">05</span><span data-i18n="club.c5"></span></p>
        <h2 class="nqc__t" data-i18n="club.t5"></h2>
        <p class="nqc__d" data-i18n="club.d5"></p>
      </div>
    </div>
    <div class="nqc__ch nqc__ch--cta" data-next-event data-from="0.89" data-to="1.01">
      <div class="nqc__copy">
        <p class="tag"><span class="nqc__n">06</span><span data-i18n="club.c6"></span></p>
        <h2 class="nqc__t" data-i18n="club.t6"></h2>
        <a class="nqc__next glass" href="events.html" data-ne-link>
          <img data-ne-poster src="assets/img/poster-sarius.jpg" alt="">
          <span><strong data-ne-title></strong><small data-ne-short></small></span>
        </a>
        <div class="hero__ctas">
          <a href="#" data-ne-ticket class="btn btn--grad"><span data-i18n="event.buy"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a href="events.html" data-ne-link class="btn btn--ghost"><span data-i18n="cta.details"></span></a>
        </div>
      </div>
    </div>

    <nav class="nqc__hud" aria-label="Intro">
      <ol>
        <li><button data-go="0.04"><span>01</span><b data-i18n="club.c1"></b></button></li>
        <li><button data-go="0.22"><span>02</span><b data-i18n="club.c2"></b></button></li>
        <li><button data-go="0.40"><span>03</span><b data-i18n="club.c3"></b></button></li>
        <li><button data-go="0.60"><span>04</span><b data-i18n="club.c4"></b></button></li>
        <li><button data-go="0.80"><span>05</span><b data-i18n="club.c5"></b></button></li>
        <li><button data-go="0.95"><span>06</span><b data-i18n="club.c6"></b></button></li>
      </ol>
      <span class="nqc__bar"><i id="nqcBar"></i></span>
    </nav>
    <button class="nqc__skip" id="nqcSkip"><span data-i18n="club.skip"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <div class="hero__scroll" id="nqcHint"><span class="hero__mouse"></span><span data-i18n="club.hint"></span></div>
  </div>
