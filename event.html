<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Question Events</title>
<meta name="description" content="No Question Events organiseert concerten, clubnights en festivals in Nederland.">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="No Question Events">
<meta property="og:image" content="assets/img/banner-crowd.jpg">
<link rel="icon" href="assets/img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css?v=1793371037">
<link rel="stylesheet" href="css/style.css?v=1793371037">
</head>
<body data-page="event" data-scene="ambient">
<main id="main">

<div id="eventPage">
<section class="ev-hero">
  <div class="ev-hero__bg" aria-hidden="true"><video data-ev="bg" muted loop playsinline preload="metadata" class="autoplay"></video></div>
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="common.home"></a><i></i><a href="events.html" data-i18n="nav.events"></a><i></i><span data-ev="title"></span></nav>
    <div class="event__grid">
      <div class="event__poster-wrap">
        <div class="event__poster tilt tilt--strong poster3d"><img data-ev="poster" src="assets/img/poster-sarius.jpg" alt=""><div class="event__shine" aria-hidden="true"></div></div>
      </div>
      <div class="event__info">
        <div class="ev-tags"><span class="pill" data-ev="type"></span><span class="live-dot"><i></i><span data-i18n="event.status"></span></span></div>
        <h1 class="event__title" data-ev="title"></h1>
        <ul class="info-grid">
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><div><small data-i18n="event.when"></small><strong data-ev="date"></strong></div></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><small data-i18n="event.start"></small><strong data-ev="time"></strong></div></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg><div><small data-i18n="event.where"></small><strong data-ev="venue"></strong></div></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><div><small data-i18n="event.host"></small><strong data-ev="host"></strong></div></li>
        </ul>
        <p class="tag tag--small" data-i18n="event.cd.title"></p>
        <div data-ev="cd"></div>
        <div class="event__ctas">
          <a href="#tickets-info" data-ev="ticket" class="btn btn--grad"><span data-i18n="event.buy"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <button class="btn btn--ghost" data-ev="ics"><span data-i18n="event.cal"></span></button>
          <a class="btn btn--ghost" data-ev="route" target="_blank" rel="noopener" href="#"><span data-i18n="event.route"></span></a>
          <button class="btn btn--ghost" data-ev="share"><span data-i18n="event.share"></span></button>
        </div>
        <p class="tbd" id="tickets-info" data-ev="tbd" data-i18n="event.tickets.tbd"></p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap grid-2" style="align-items:start">
    <div><p class="tag" data-i18n="event.desc.tag"></p><h2 class="h2" data-ev="title"></h2></div>
    <div><p class="lead" data-ev="desc1"></p><p class="body" data-ev="desc2"></p></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <p class="tag" data-i18n="event.lineup"></p>
    <div class="lineup" id="lineup" data-stagger></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <p class="tag" data-i18n="event.media"></p>
    <div class="emedia-grid" id="eventMedia" data-lb-group></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <p class="tag" data-i18n="event.venue.tag"></p>
    <div class="venue">
      <div class="venue__info">
        <h2 class="venue__name" data-ev="venuename"></h2>
        <p class="body" data-ev="address" style="margin:0"></p>
        <div class="event__ctas"><a class="btn btn--ghost" data-ev="route" target="_blank" rel="noopener" href="#"><span data-i18n="event.route"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
      </div>
      <div class="clubs__map glass" id="mapWrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="clubs__map-hud" aria-hidden="true"><span>NL</span><span id="mapCoords"></span></div>
</div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap faq-grid">
    <div><p class="tag" data-i18n="faq.tag"></p><h2 class="h2" data-i18n="faq.title"></h2><a class="link-arrow" href="events.html"><span data-i18n="cta.back"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    <div class="faq"><details><summary data-i18n="faq.q1"></summary><div class="faq__a"><p data-i18n="faq.a1"></p></div></details><details><summary data-i18n="faq.q2"></summary><div class="faq__a"><p data-i18n="faq.a2"></p></div></details><details><summary data-i18n="faq.q3"></summary><div class="faq__a"><p data-i18n="faq.a3"></p></div></details><details><summary data-i18n="faq.q4"></summary><div class="faq__a"><p data-i18n="faq.a4"></p></div></details><details><summary data-i18n="faq.q5"></summary><div class="faq__a"><p data-i18n="faq.a5"></p></div></details></div>
  </div>
</section>
</div>

</main>
<script src="js/config.js?v=1793371037"></script>
<script src="js/i18n.js?v=1793371037"></script>
<script src="js/layout.js?v=1793371037"></script>
<script src="vendor/three.min.js?v=1793371037"></script>
<script src="vendor/gsap.min.js?v=1793371037"></script>
<script src="vendor/ScrollTrigger.min.js?v=1793371037"></script>
<script src="vendor/lenis.min.js?v=1793371037"></script>
<script src="vendor/leaflet.js?v=1793371037"></script>

<script src="js/scene.js?v=1793371037"></script>


<script src="js/app.js?v=1793371037"></script>
<script src="js/carousel.js?v=1793371037"></script>

</body>
</html>
